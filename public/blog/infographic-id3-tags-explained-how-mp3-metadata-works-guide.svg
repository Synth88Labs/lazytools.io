<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="v2grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f1fe"/>
      <stop offset="1" stop-color="#d3e5fd"/>
    </linearGradient>
    <linearGradient id="audiograd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1e8fd"/>
      <stop offset="1" stop-color="#e4d3fb"/>
    </linearGradient>
    <linearGradient id="v1grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdeede"/>
      <stop offset="1" stop-color="#f9dfc0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="700" fill="#f8fafc"/>

  <text x="60" y="58" font-size="30" font-weight="700" fill="#0f172a">Inside an MP3 file: where ID3 metadata lives</text>
  <text x="60" y="90" font-size="17" fill="#64748b">Two tag generations wrap the compressed audio. Players read them to show title, artist and album.</text>

  <!-- File layout bar -->
  <text x="60" y="140" font-size="15" fill="#94a3b8">START of file</text>
  <text x="1140" y="140" font-size="15" fill="#94a3b8" text-anchor="end">END of file</text>

  <!-- ID3v2 block -->
  <rect x="60" y="150" width="300" height="120" rx="8" fill="url(#v2grad)" stroke="#1d87f1" stroke-width="2"/>
  <text x="210" y="182" font-size="20" font-weight="700" fill="#1d87f1" text-anchor="middle">ID3v2 tag</text>
  <text x="210" y="208" font-size="14" fill="#334155" text-anchor="middle">At the start, before the audio</text>
  <text x="210" y="230" font-size="14" fill="#334155" text-anchor="middle">Extensible, frame-based</text>
  <text x="210" y="252" font-size="14" fill="#334155" text-anchor="middle">Unicode text plus cover art</text>

  <!-- Audio block -->
  <rect x="368" y="150" width="500" height="120" rx="8" fill="url(#audiograd)" stroke="#7c3aed" stroke-width="2"/>
  <text x="618" y="182" font-size="20" font-weight="700" fill="#7c3aed" text-anchor="middle">MPEG audio frames</text>
  <text x="618" y="208" font-size="14" fill="#334155" text-anchor="middle">The actual compressed sound</text>
  <text x="618" y="230" font-size="14" fill="#334155" text-anchor="middle">First frame header holds bitrate,</text>
  <text x="618" y="252" font-size="14" fill="#334155" text-anchor="middle">sample rate, layer and channel mode</text>

  <!-- ID3v1 block -->
  <rect x="876" y="150" width="264" height="120" rx="8" fill="url(#v1grad)" stroke="#d97706" stroke-width="2"/>
  <text x="1008" y="182" font-size="20" font-weight="700" fill="#d97706" text-anchor="middle">ID3v1 tag</text>
  <text x="1008" y="208" font-size="14" fill="#334155" text-anchor="middle">Last 128 bytes, starts "TAG"</text>
  <text x="1008" y="230" font-size="14" fill="#334155" text-anchor="middle">Fixed slots, no Unicode,</text>
  <text x="1008" y="252" font-size="14" fill="#334155" text-anchor="middle">no cover art (legacy fallback)</text>

  <!-- Left panel: ID3v2 frames -->
  <rect x="60" y="320" width="360" height="330" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="82" y="356" font-size="18" font-weight="700" fill="#1d87f1">ID3v2 frames (4-char ID plus data)</text>

  <text x="82" y="392" font-size="15" fill="#0f172a" font-family="Consolas, monospace" font-weight="700">TIT2</text>
  <text x="180" y="392" font-size="15" fill="#334155">Title</text>
  <text x="82" y="422" font-size="15" fill="#0f172a" font-family="Consolas, monospace" font-weight="700">TPE1</text>
  <text x="180" y="422" font-size="15" fill="#334155">Lead artist / performer</text>
  <text x="82" y="452" font-size="15" fill="#0f172a" font-family="Consolas, monospace" font-weight="700">TALB</text>
  <text x="180" y="452" font-size="15" fill="#334155">Album</text>
  <text x="82" y="482" font-size="15" fill="#0f172a" font-family="Consolas, monospace" font-weight="700">TRCK</text>
  <text x="180" y="482" font-size="15" fill="#334155">Track number</text>
  <text x="82" y="512" font-size="15" fill="#0f172a" font-family="Consolas, monospace" font-weight="700">TCON</text>
  <text x="180" y="512" font-size="15" fill="#334155">Genre</text>
  <text x="82" y="542" font-size="15" fill="#0f172a" font-family="Consolas, monospace" font-weight="700">TDRC</text>
  <text x="180" y="542" font-size="15" fill="#334155">Recording date (TYER in 2.3)</text>
  <text x="82" y="572" font-size="15" fill="#0f172a" font-family="Consolas, monospace" font-weight="700">APIC</text>
  <text x="180" y="572" font-size="15" fill="#334155">Attached picture (cover art)</text>

  <line x1="82" y1="592" x2="398" y2="592" stroke="#e2e8f0" stroke-width="1"/>
  <text x="82" y="620" font-size="13" fill="#64748b">Unknown frame? A reader skips it using</text>
  <text x="82" y="638" font-size="13" fill="#64748b">the declared length, so old software never breaks.</text>

  <!-- Right panel: encoding / garbled -->
  <rect x="450" y="320" width="690" height="330" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="472" y="356" font-size="18" font-weight="700" fill="#16a34a">Why tags go garbled: the encoding byte</text>
  <text x="472" y="382" font-size="14" fill="#64748b">Every ID3v2 text frame starts with one byte saying how the text is stored.</text>

  <!-- byte sequence -->
  <text x="472" y="418" font-size="14" fill="#334155">Title frame bytes:</text>
  <g font-family="Consolas, monospace" font-size="16" font-weight="700">
    <rect x="472" y="430" width="46" height="40" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="495" y="456" fill="#166534" text-anchor="middle">03</text>
    <rect x="524" y="430" width="46" height="40" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="547" y="456" fill="#334155" text-anchor="middle">43</text>
    <rect x="576" y="430" width="46" height="40" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="599" y="456" fill="#334155" text-anchor="middle">61</text>
    <rect x="628" y="430" width="46" height="40" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="651" y="456" fill="#334155" text-anchor="middle">66</text>
    <rect x="680" y="430" width="98" height="40" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="729" y="456" fill="#92400e" text-anchor="middle">C3 A9</text>
  </g>
  <text x="495" y="490" font-size="12" fill="#16a34a" text-anchor="middle">UTF-8</text>
  <text x="547" y="490" font-size="12" fill="#64748b" text-anchor="middle">C</text>
  <text x="599" y="490" font-size="12" fill="#64748b" text-anchor="middle">a</text>
  <text x="651" y="490" font-size="12" fill="#64748b" text-anchor="middle">f</text>
  <text x="729" y="490" font-size="12" fill="#d97706" text-anchor="middle">one char</text>

  <!-- correct vs wrong -->
  <rect x="472" y="510" width="300" height="60" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="490" y="535" font-size="13" fill="#166534">Honours byte 03 = UTF-8</text>
  <text x="490" y="558" font-size="20" font-weight="700" fill="#0f172a">Cafe with accent: Café</text>

  <rect x="800" y="510" width="300" height="60" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="818" y="535" font-size="13" fill="#991b1b">Guesses Latin-1 instead</text>
  <text x="818" y="558" font-size="20" font-weight="700" fill="#0f172a">Mojibake: CafÃ©</text>

  <!-- encoding table -->
  <text x="472" y="602" font-size="13" fill="#64748b">Encoding byte 0 = Latin-1   |   1 = UTF-16 with BOM   |   2 = UTF-16 big-endian (2.4)   |   3 = UTF-8 (2.4)</text>
  <text x="472" y="628" font-size="13" fill="#64748b">Same bytes, different assumption. Only the reader that respects the byte shows text correctly.</text>

  <text x="60" y="682" font-size="14" fill="#94a3b8">lazytools.io/video/mp3-tag-reader/</text>
</svg>
