<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="How a resize-to-KB tool shrinks a 480 KB photo to 48 KB. Step 1: it binary-searches the JPEG quality to find the highest setting that stays at or under the target file size. Step 2: if even the lowest quality is still too big, it downscales the pixel dimensions and retries until the file fits. The result is a 48 KB JPEG that is never uploaded and works offline.">
  <rect x="0" y="0" width="1200" height="700" fill="#f8fafc"/>

  <!-- Title -->
  <text x="600" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#0f172a">Reduce an image to a target KB</text>
  <text x="600" y="106" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#334155">Lower the quality first &#8212; downscale only if it still won&#8217;t fit</text>

  <!-- Source card -->
  <g>
    <rect x="60" y="270" width="230" height="160" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="3"/>
    <text x="175" y="332" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#334155">Source</text>
    <text x="175" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="52" font-weight="700" fill="#0f172a">480 KB</text>
  </g>

  <!-- Arrow 1 -->
  <g>
    <line x1="300" y1="350" x2="360" y2="350" stroke="#1e3a8a" stroke-width="6"/>
    <path d="M360 350 l-18 -11 v22 z" fill="#1e3a8a"/>
  </g>

  <!-- Step 1 card: binary-search quality -->
  <g>
    <rect x="372" y="220" width="300" height="260" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="3"/>
    <text x="522" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1e3a8a">STEP 1</text>
    <text x="522" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">Binary-search</text>
    <text x="522" y="354" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">JPEG quality</text>
    <text x="522" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#334155">Highest quality that</text>
    <text x="522" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#334155">stays &#8804; target KB</text>
  </g>

  <!-- Arrow 2 -->
  <g>
    <line x1="682" y1="350" x2="742" y2="350" stroke="#1e3a8a" stroke-width="6"/>
    <path d="M742 350 l-18 -11 v22 z" fill="#1e3a8a"/>
  </g>

  <!-- Step 2 card: downscale if needed -->
  <g>
    <rect x="754" y="220" width="300" height="260" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="3"/>
    <text x="904" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1e3a8a">STEP 2 (if needed)</text>
    <text x="904" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">Still too big?</text>
    <text x="904" y="354" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">Downscale pixels</text>
    <text x="904" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#334155">Fewer pixels &#8594;</text>
    <text x="904" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#334155">fewer bytes, then retry</text>
  </g>

  <!-- Result card -->
  <g>
    <rect x="470" y="520" width="260" height="120" rx="16" fill="#ffffff" stroke="#166534" stroke-width="4"/>
    <text x="600" y="568" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#166534">Fits the form</text>
    <text x="600" y="616" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#166534">48 KB JPEG</text>
  </g>

  <!-- Arrow down to result -->
  <g>
    <line x1="600" y1="482" x2="600" y2="516" stroke="#166534" stroke-width="6"/>
    <path d="M600 516 l-11 -18 h22 z" fill="#166534"/>
  </g>

  <!-- Footer -->
  <text x="600" y="678" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#334155">In your browser via Canvas &#8212; never uploaded &#8212; lazytools.io/image/resize-image-to-kb</text>
</svg>
