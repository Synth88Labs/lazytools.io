<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="The US Navy body fat method uses tape measurements: men measure neck and waist; women add hips; plus height for both.">
  <rect width="1200" height="700" fill="#f8fafc"/>
  <text x="600" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="43" font-weight="800" fill="#0f172a">Body fat from a tape measure</text>
  <text x="600" y="102" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" fill="#475569">The US Navy method needs just a few measurements and your height.</text>

  <!-- Men -->
  <g>
    <rect x="70" y="150" width="500" height="300" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="3"/>
    <text x="100" y="200" font-family="system-ui, sans-serif" font-size="27" font-weight="800" fill="#1e3a8a">Men — measure</text>
    <text x="100" y="248" font-family="system-ui, sans-serif" font-size="23" fill="#334155">&#9679; Neck (just below the larynx)</text>
    <text x="100" y="288" font-family="system-ui, sans-serif" font-size="23" fill="#334155">&#9679; Waist (at the navel)</text>
    <text x="100" y="328" font-family="system-ui, sans-serif" font-size="23" fill="#334155">&#9679; Height</text>
    <rect x="100" y="360" width="440" height="66" rx="10" fill="#eff6ff"/>
    <text x="320" y="401" text-anchor="middle" font-family="system-ui, sans-serif" font-size="21" fill="#1e3a8a">Based on waist minus neck</text>
  </g>

  <!-- Women -->
  <g>
    <rect x="630" y="150" width="500" height="300" rx="18" fill="#ffffff" stroke="#fbcfe8" stroke-width="3"/>
    <text x="660" y="200" font-family="system-ui, sans-serif" font-size="27" font-weight="800" fill="#9d174d">Women — measure</text>
    <text x="660" y="248" font-family="system-ui, sans-serif" font-size="23" fill="#334155">&#9679; Neck (just below the larynx)</text>
    <text x="660" y="288" font-family="system-ui, sans-serif" font-size="23" fill="#334155">&#9679; Waist (narrowest point)</text>
    <text x="660" y="328" font-family="system-ui, sans-serif" font-size="23" fill="#334155">&#9679; Hips (widest point) + Height</text>
    <rect x="660" y="360" width="440" height="66" rx="10" fill="#fdf2f8"/>
    <text x="880" y="401" text-anchor="middle" font-family="system-ui, sans-serif" font-size="21" fill="#9d174d">Based on waist + hips minus neck</text>
  </g>

  <g>
    <rect x="70" y="480" width="1060" height="150" rx="16" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
    <text x="600" y="524" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#166534">Keep the tape snug and level</text>
    <text x="600" y="562" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" fill="#334155">It\'s an estimate — usually within about 3% of lab methods for average builds, but less</text>
    <text x="600" y="590" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" fill="#334155">accurate for very muscular or very lean people. It reads fat from girth, not from a scan.</text>
  </g>
  <text x="600" y="666" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#94a3b8">lazytools.io/fitness/navy-body-fat-calculator</text>
</svg>
