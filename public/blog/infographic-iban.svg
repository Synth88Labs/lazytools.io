<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="The IBAN mod-97 check in three steps: move the first four characters to the end, replace each letter with two digits from A equals 10 to Z equals 35, then take the whole number modulo 97 which equals 1 for a valid IBAN.">
  <rect width="1200" height="700" fill="#f8fafc"/>

  <!-- Title -->
  <text x="600" y="58" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#0f172a">How the IBAN mod-97 check works</text>

  <!-- IBAN structure label -->
  <g font-family="'Courier New', monospace">
    <rect x="130" y="92" width="180" height="48" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="220" y="124" text-anchor="middle" font-size="30" font-weight="700" fill="#1e3a8a">GB</text>
    <rect x="322" y="92" width="140" height="48" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="392" y="124" text-anchor="middle" font-size="30" font-weight="700" fill="#1e3a8a">82</text>
    <rect x="474" y="92" width="596" height="48" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="772" y="124" text-anchor="middle" font-size="30" font-weight="700" fill="#334155">WEST 1234 5698 7654 32</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#334155">
    <text x="220" y="172" text-anchor="middle">country</text>
    <text x="392" y="172" text-anchor="middle">check</text>
    <text x="772" y="172" text-anchor="middle">BBAN (bank &amp; account)</text>
  </g>

  <!-- Step 1 -->
  <g font-family="Arial, Helvetica, sans-serif">
    <circle cx="90" cy="270" r="30" fill="#1e3a8a"/>
    <text x="90" y="282" text-anchor="middle" font-size="34" font-weight="700" fill="#ffffff">1</text>
    <text x="140" y="255" font-size="32" font-weight="700" fill="#0f172a">Move the first 4 characters to the end</text>
    <rect x="140" y="278" width="920" height="56" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="164" y="316" font-family="'Courier New', monospace" font-size="30" font-weight="700" fill="#334155">WEST 1234 5698 7654 32</text>
    <text x="712" y="316" font-family="'Courier New', monospace" font-size="30" font-weight="700" fill="#1e3a8a">GB82</text>
    <text x="1030" y="316" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#334155">&#8594;</text>
  </g>

  <!-- Step 2 -->
  <g font-family="Arial, Helvetica, sans-serif">
    <circle cx="90" cy="420" r="30" fill="#1e3a8a"/>
    <text x="90" y="432" text-anchor="middle" font-size="34" font-weight="700" fill="#ffffff">2</text>
    <text x="140" y="405" font-size="32" font-weight="700" fill="#0f172a">Replace letters with digits (A=10 &#8230; Z=35)</text>
    <rect x="140" y="428" width="920" height="56" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="164" y="466" font-family="'Courier New', monospace" font-size="30" font-weight="700" fill="#334155">W=32  E=14  S=28  T=29 &#8230; G=16 B=11</text>
  </g>

  <!-- Step 3 -->
  <g font-family="Arial, Helvetica, sans-serif">
    <circle cx="90" cy="580" r="30" fill="#1e3a8a"/>
    <text x="90" y="592" text-anchor="middle" font-size="34" font-weight="700" fill="#ffffff">3</text>
    <text x="140" y="560" font-size="32" font-weight="700" fill="#0f172a">Read as one big number, take modulo 97</text>
    <rect x="140" y="583" width="640" height="60" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="164" y="623" font-family="'Courier New', monospace" font-size="30" font-weight="700" fill="#334155">3214 &#8230; 1611  mod 97</text>
    <text x="800" y="623" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#334155">&#8594;</text>
    <rect x="852" y="583" width="208" height="60" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="3"/>
    <text x="956" y="624" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#15803d">= 1  valid &#10003;</text>
  </g>

  <!-- Footer -->
  <text x="1070" y="682" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#334155">lazytools.io/dev/iban-validator</text>
</svg>
