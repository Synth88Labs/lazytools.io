<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="700" fill="#f8fafc" />

  <text x="600" y="46" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">Encoding one coordinate: latitude 38.5</text>
  <text x="600" y="78" text-anchor="middle" font-size="17" fill="#64748b">Google's Encoded Polyline Algorithm turns each value into a run of printable ASCII</text>

  <!-- Step 1: Scale -->
  <g>
    <rect x="60" y="120" width="240" height="150" rx="12" fill="#ffffff" stroke="#1d87f1" stroke-width="2" />
    <circle cx="92" cy="152" r="16" fill="#1d87f1" />
    <text x="92" y="158" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">1</text>
    <text x="120" y="158" font-size="19" font-weight="700" fill="#0f172a">Scale plus round</text>
    <text x="80" y="196" font-size="15" fill="#334155">Multiply by 10 to the 5th,</text>
    <text x="80" y="216" font-size="15" fill="#334155">round to an integer.</text>
    <text x="80" y="216" font-size="15" fill="#334155"> </text>
    <text x="180" y="252" text-anchor="middle" font-size="22" font-weight="700" fill="#1d87f1">3 850 000</text>
  </g>

  <!-- Step 2: Delta -->
  <g>
    <rect x="330" y="120" width="240" height="150" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2" />
    <circle cx="362" cy="152" r="16" fill="#16a34a" />
    <text x="362" y="158" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">2</text>
    <text x="390" y="158" font-size="19" font-weight="700" fill="#0f172a">Delta</text>
    <text x="350" y="196" font-size="15" fill="#334155">Store the change from</text>
    <text x="350" y="216" font-size="15" fill="#334155">the previous point. First</text>
    <text x="350" y="236" font-size="15" fill="#334155">point is measured from 0.</text>
    <text x="450" y="262" text-anchor="middle" font-size="20" font-weight="700" fill="#16a34a">3 850 000</text>
  </g>

  <!-- Step 3: Zig-zag -->
  <g>
    <rect x="600" y="120" width="240" height="150" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="2" />
    <circle cx="632" cy="152" r="16" fill="#d97706" />
    <text x="632" y="158" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">3</text>
    <text x="660" y="158" font-size="19" font-weight="700" fill="#0f172a">Zig-zag sign</text>
    <text x="620" y="196" font-size="15" fill="#334155">Shift left one bit; if it</text>
    <text x="620" y="216" font-size="15" fill="#334155">was negative, invert all</text>
    <text x="620" y="236" font-size="15" fill="#334155">bits. Small numbers stay small.</text>
    <text x="720" y="262" text-anchor="middle" font-size="20" font-weight="700" fill="#d97706">7 700 000</text>
  </g>

  <!-- Step 4: Base 32 -->
  <g>
    <rect x="870" y="120" width="270" height="150" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2" />
    <circle cx="902" cy="152" r="16" fill="#7c3aed" />
    <text x="902" y="158" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">4</text>
    <text x="930" y="158" font-size="19" font-weight="700" fill="#0f172a">Chunk base 32</text>
    <text x="890" y="196" font-size="15" fill="#334155">Split into 5-bit groups,</text>
    <text x="890" y="216" font-size="15" fill="#334155">least-significant first.</text>
    <text x="1005" y="252" text-anchor="middle" font-size="14" font-weight="700" fill="#7c3aed" font-family="Consolas, monospace">00000 10001 11111</text>
    <text x="1005" y="270" text-anchor="middle" font-size="14" font-weight="700" fill="#7c3aed" font-family="Consolas, monospace">01010 00111</text>
  </g>

  <!-- arrows between steps -->
  <line x1="300" y1="195" x2="328" y2="195" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="570" y1="195" x2="598" y2="195" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="840" y1="195" x2="868" y2="195" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 5: Make printable -->
  <g>
    <rect x="330" y="330" width="540" height="120" rx="12" fill="#0f172a" />
    <circle cx="366" cy="366" r="16" fill="#1d87f1" />
    <text x="366" y="372" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">5</text>
    <text x="394" y="372" font-size="19" font-weight="700" fill="#ffffff">Make it printable</text>
    <text x="358" y="404" font-size="15" fill="#cbd5e1">Set the 0x20 continuation bit on every chunk but the last,</text>
    <text x="358" y="424" font-size="15" fill="#cbd5e1">add 63 so each lands in printable ASCII, then emit the characters.</text>
    <text x="800" y="400" text-anchor="middle" font-size="34" font-weight="700" fill="#38bdf8" font-family="Consolas, monospace">_p~iF</text>
  </g>

  <line x1="1005" y1="272" x2="1005" y2="310" stroke="#64748b" stroke-width="2" />
  <line x1="1005" y1="310" x2="602" y2="310" stroke="#64748b" stroke-width="2" />
  <line x1="602" y1="310" x2="602" y2="328" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Full example bar -->
  <rect x="60" y="500" width="1080" height="120" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
  <text x="90" y="536" font-size="17" font-weight="700" fill="#0f172a">Three points, chained by deltas</text>
  <text x="90" y="566" font-size="15" fill="#334155" font-family="Consolas, monospace">[[38.5, -120.2], [40.7, -120.95], [43.252, -126.453]]</text>
  <text x="90" y="590" font-size="14" fill="#64748b">encodes to</text>
  <text x="170" y="591" font-size="17" font-weight="700" fill="#7c3aed" font-family="Consolas, monospace">_p~iF~ps|U_ulLnnqC_mqNvxq`@</text>
  <text x="90" y="612" font-size="13" fill="#94a3b8">Each point after the first adds only a few characters. Points are stored latitude then longitude, at precision 5 (about 1 metre).</text>

  <text x="1140" y="668" text-anchor="end" font-size="14" fill="#94a3b8">lazytools.io/file/polyline-encoder-decoder/</text>
</svg>
