<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="The score needed on a final equals the target minus your current grade times one minus the final weight, all divided by the final weight.">
  <rect width="1200" height="700" fill="#f8fafc"/>
  <text x="600" y="62" text-anchor="middle" font-family="system-ui, sans-serif" font-size="42" font-weight="800" fill="#0f172a">What do I need on the final?</text>
  <text x="600" y="104" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" fill="#475569">Your current grade already covers part of the course — solve for the rest.</text>

  <g>
    <rect x="90" y="150" width="1020" height="130" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="3"/>
    <text x="600" y="205" text-anchor="middle" font-family="ui-monospace, monospace" font-size="27" font-weight="700" fill="#1e3a8a">needed = (target &#8722; current &#215; (1 &#8722; weight)) &#247; weight</text>
    <text x="600" y="252" text-anchor="middle" font-family="system-ui, sans-serif" font-size="21" fill="#64748b">weight = the final\'s share of the grade, as a decimal (30% = 0.30)</text>
  </g>

  <g font-family="system-ui, sans-serif">
    <rect x="150" y="320" width="900" height="250" rx="16" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
    <text x="600" y="366" text-anchor="middle" font-size="25" font-weight="800" fill="#166534">Example</text>
    <text x="180" y="416" font-size="23" fill="#334155">Current grade: 85%&#8195;&#8195;Target: 90%&#8195;&#8195;Final worth: 30% (0.30)</text>
    <text x="180" y="462" font-family="ui-monospace, monospace" font-size="22" fill="#0f172a">needed = (90 &#8722; 85 &#215; 0.70) &#247; 0.30</text>
    <text x="180" y="498" font-family="ui-monospace, monospace" font-size="22" fill="#0f172a">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160; = (90 &#8722; 59.5) &#247; 0.30 = 101.7%</text>
    <text x="600" y="544" text-anchor="middle" font-size="22" font-weight="700" fill="#991b1b">Over 100% &#8594; an A- isn\'t reachable on the final alone here.</text>
  </g>

  <text x="600" y="620" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" fill="#334155">If the answer is 0 or below, you\'ve already secured your target no matter what.</text>
  <text x="600" y="666" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#94a3b8">lazytools.io/calc/final-grade-calculator</text>
</svg>
