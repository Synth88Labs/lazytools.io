<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The ACSM calories-burned formula: calories per minute equals MET times 3.5 times body weight in kilograms divided by 200. Worked example: running at about 9.3 METs for a 70 kilogram person over 30 minutes burns about 340 kilocalories. One MET equals sitting at rest.">
  <rect width="1200" height="700" fill="#f8fafc"/>

  <!-- Title -->
  <text x="600" y="74" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="800" fill="#0f172a">How many calories did I burn?</text>
  <text x="600" y="116" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="600" fill="#334155">The ACSM formula, one line of maths</text>

  <!-- Focal formula card -->
  <rect x="90" y="150" width="1020" height="180" rx="20" fill="#ffffff" stroke="#bfdbfe" stroke-width="3"/>
  <text x="600" y="238" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="46" font-weight="800" fill="#ea580c">cal/min = MET &#215; 3.5 &#215; weight(kg) &#247; 200</text>
  <text x="600" y="292" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="600" fill="#334155">then &#215; minutes for the session total</text>

  <!-- Worked example card -->
  <rect x="90" y="360" width="640" height="270" rx="20" fill="#ffffff" stroke="#bfdbfe" stroke-width="3"/>
  <text x="130" y="410" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="800" fill="#0f172a">Worked example &#8212; running</text>

  <text x="130" y="458" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#334155">Runner &#8776; 9.3 MET &#183; 70 kg &#183; 30 min</text>
  <text x="130" y="500" font-family="Consolas, Menlo, monospace" font-size="24" font-weight="700" fill="#334155">9.3 &#215; 3.5 &#215; 70 &#247; 200 = 11.4 cal/min</text>

  <rect x="130" y="524" width="470" height="74" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2.5"/>
  <text x="365" y="573" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800" fill="#ea580c">11.4 &#215; 30 &#8776; 340 kcal</text>

  <!-- What is a MET card -->
  <rect x="760" y="360" width="350" height="270" rx="20" fill="#ffffff" stroke="#bfdbfe" stroke-width="3"/>
  <text x="935" y="410" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="800" fill="#0f172a">What is a MET?</text>

  <circle cx="935" cy="486" r="46" fill="#fff7ed" stroke="#f97316" stroke-width="3"/>
  <text x="935" y="478" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800" fill="#ea580c">1</text>
  <text x="935" y="508" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#ea580c">MET</text>

  <text x="935" y="566" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" fill="#334155">= sitting at rest.</text>
  <text x="935" y="596" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" fill="#334155">8 MET = 8&#215; that energy.</text>

  <!-- Footer -->
  <text x="600" y="672" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#ea580c">lazytools.io/fitness/calories-burned-calculator</text>
</svg>
