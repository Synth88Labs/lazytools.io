<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="pemG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef4ff"/>
      <stop offset="1" stop-color="#dbe8ff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="700" fill="#f8fafc"/>

  <text x="600" y="46" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">Reading an X.509 Certificate: peeling the packaging</text>
  <text x="600" y="76" text-anchor="middle" font-size="16" fill="#64748b">PEM is text-wrapped, Base64-encoded DER bytes of the same X.509 fields. Decoding just unwraps the layers.</text>

  <!-- Stage 1: PEM -->
  <rect x="40" y="110" width="300" height="470" rx="12" fill="url(#pemG)" stroke="#1d87f1" stroke-width="1.5"/>
  <text x="60" y="140" font-size="18" font-weight="700" fill="#1d87f1">1. PEM</text>
  <text x="60" y="162" font-size="13" fill="#334155">Text envelope (RFC 7468)</text>
  <rect x="60" y="178" width="260" height="382" rx="6" fill="#0f172a"/>
  <text x="74" y="204" font-size="12.5" fill="#7dd3fc" font-family="Consolas, monospace">-----BEGIN CERTIFICATE-----</text>
  <text x="74" y="228" font-size="12.5" fill="#e2e8f0" font-family="Consolas, monospace">MIIDdzCCAl+gAwIBAgIEBKGf</text>
  <text x="74" y="248" font-size="12.5" fill="#e2e8f0" font-family="Consolas, monospace">wsIwDQYJKoZIhvcNAQELBQAw</text>
  <text x="74" y="268" font-size="12.5" fill="#e2e8f0" font-family="Consolas, monospace">RTELMAkGA1UEBhMCVVMxFzAV</text>
  <text x="74" y="288" font-size="12.5" fill="#e2e8f0" font-family="Consolas, monospace">BgNVBAoTDkxldCdzIEVuY3J5</text>
  <text x="74" y="308" font-size="12.5" fill="#e2e8f0" font-family="Consolas, monospace">cHQxCzAJBgNVBAMTAlIzMB4X</text>
  <text x="74" y="328" font-size="12.5" fill="#e2e8f0" font-family="Consolas, monospace">DTI2MDYwMTAwMDAwMFoXDTI2</text>
  <text x="74" y="348" font-size="12.5" fill="#e2e8f0" font-family="Consolas, monospace">MDgzMDIzNTk1OVowFjEUMBIG</text>
  <text x="74" y="368" font-size="12.5" fill="#94a3b8" font-family="Consolas, monospace">... Base64 wall of text ...</text>
  <text x="74" y="392" font-size="12.5" fill="#e2e8f0" font-family="Consolas, monospace">hkiG9w0BAQsFAAOCAQEAbc12</text>
  <text x="74" y="412" font-size="12.5" fill="#e2e8f0" font-family="Consolas, monospace">Qw3mZp0rT8vX2yL6nK4dJ9sF</text>
  <text x="74" y="436" font-size="12.5" fill="#7dd3fc" font-family="Consolas, monospace">-----END CERTIFICATE-----</text>
  <text x="74" y="486" font-size="12" fill="#cbd5e1">Copy-paste friendly:</text>
  <text x="74" y="506" font-size="12" fill="#cbd5e1">just header + Base64 + footer.</text>
  <text x="74" y="536" font-size="12" fill="#cbd5e1">Never paste a PRIVATE KEY</text>
  <text x="74" y="554" font-size="12" fill="#fca5a5">block into any tool.</text>

  <!-- arrow 1 -->
  <line x1="342" y1="345" x2="392" y2="345" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="367" y="330" text-anchor="middle" font-size="11" fill="#64748b">Base64</text>
  <text x="367" y="366" text-anchor="middle" font-size="11" fill="#64748b">decode</text>

  <!-- Stage 2: DER -->
  <rect x="396" y="110" width="240" height="470" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="416" y="140" font-size="18" font-weight="700" fill="#d97706">2. DER</text>
  <text x="416" y="162" font-size="13" fill="#334155">Binary bytes (strict BER)</text>
  <rect x="416" y="178" width="200" height="230" rx="6" fill="#1e293b"/>
  <text x="430" y="206" font-size="13" fill="#fdba74" font-family="Consolas, monospace">30 82 03 77</text>
  <text x="430" y="228" font-size="13" fill="#e2e8f0" font-family="Consolas, monospace">30 82 02 5f</text>
  <text x="430" y="250" font-size="13" fill="#e2e8f0" font-family="Consolas, monospace">a0 03 02 01</text>
  <text x="430" y="272" font-size="13" fill="#e2e8f0" font-family="Consolas, monospace">02 02 04 04</text>
  <text x="430" y="294" font-size="13" fill="#e2e8f0" font-family="Consolas, monospace">a1 9f c2 30</text>
  <text x="430" y="316" font-size="13" fill="#e2e8f0" font-family="Consolas, monospace">0d 06 09 2a</text>
  <text x="430" y="338" font-size="13" fill="#94a3b8" font-family="Consolas, monospace">...raw hex...</text>
  <text x="430" y="370" font-size="12" fill="#cbd5e1" font-family="Consolas, monospace">30 = SEQUENCE</text>
  <text x="430" y="390" font-size="12" fill="#cbd5e1" font-family="Consolas, monospace">tag / length /</text>
  <text x="430" y="408" font-size="12" fill="#cbd5e1" font-family="Consolas, monospace">value bytes</text>
  <text x="416" y="446" font-size="12" fill="#334155">One unambiguous byte</text>
  <text x="416" y="464" font-size="12" fill="#334155">encoding of the ASN.1.</text>
  <text x="416" y="490" font-size="12" fill="#334155">A .crt / .cer / .pem file</text>
  <text x="416" y="508" font-size="12" fill="#334155">may hold raw DER or the</text>
  <text x="416" y="526" font-size="12" fill="#334155">Base64 PEM text.</text>

  <!-- arrow 2 -->
  <line x1="638" y1="345" x2="688" y2="345" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="663" y="330" text-anchor="middle" font-size="11" fill="#64748b">walk</text>
  <text x="663" y="366" text-anchor="middle" font-size="11" fill="#64748b">ASN.1</text>

  <!-- Stage 3: X.509 fields -->
  <rect x="692" y="110" width="468" height="470" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="712" y="140" font-size="18" font-weight="700" fill="#16a34a">3. Readable X.509 fields</text>
  <text x="712" y="162" font-size="13" fill="#334155">The ASN.1 SEQUENCE, decoded (RFC 5280)</text>

  <!-- field rows -->
  <g font-size="14">
    <rect x="712" y="176" width="428" height="34" rx="5" fill="#f1f5f9"/>
    <text x="726" y="198" font-weight="700" fill="#0f172a">Subject</text>
    <text x="900" y="198" fill="#334155">CN = example.com</text>

    <rect x="712" y="214" width="428" height="34" rx="5" fill="#f8fafc"/>
    <text x="726" y="236" font-weight="700" fill="#0f172a">Issuer</text>
    <text x="900" y="236" fill="#334155">Let's Encrypt, CN = R3</text>

    <rect x="712" y="252" width="428" height="34" rx="5" fill="#f1f5f9"/>
    <text x="726" y="274" font-weight="700" fill="#0f172a">Serial number</text>
    <text x="900" y="274" fill="#334155">04:a1:9f: ... :c2</text>

    <rect x="712" y="290" width="428" height="34" rx="5" fill="#fef2f2"/>
    <text x="726" y="312" font-weight="700" fill="#0f172a">Validity</text>
    <text x="900" y="312" fill="#b91c1c">notAfter 2026-08-30 (check!)</text>

    <rect x="712" y="328" width="428" height="34" rx="5" fill="#f8fafc"/>
    <text x="726" y="350" font-weight="700" fill="#0f172a">Public key</text>
    <text x="900" y="350" fill="#334155">RSA 2048-bit</text>

    <rect x="712" y="366" width="428" height="34" rx="5" fill="#f1f5f9"/>
    <text x="726" y="388" font-weight="700" fill="#0f172a">Signature alg.</text>
    <text x="900" y="388" fill="#334155">sha256WithRSAEncryption</text>

    <rect x="712" y="404" width="428" height="34" rx="5" fill="#eff6ff"/>
    <text x="726" y="426" font-weight="700" fill="#1d4ed8">SAN (hostnames)</text>
    <text x="900" y="426" fill="#1d4ed8">example.com, www.example.com</text>

    <rect x="712" y="442" width="428" height="34" rx="5" fill="#f8fafc"/>
    <text x="726" y="464" font-weight="700" fill="#0f172a">Extended Key Usage</text>
    <text x="900" y="464" fill="#334155">TLS Web Server Auth</text>

    <rect x="712" y="480" width="428" height="34" rx="5" fill="#f1f5f9"/>
    <text x="726" y="502" font-weight="700" fill="#0f172a">Basic Constraints</text>
    <text x="900" y="502" fill="#334155">CA:FALSE (a leaf cert)</text>
  </g>

  <text x="712" y="540" font-size="12.5" fill="#64748b">Browsers match the hostname against the SAN list only, not the Common Name.</text>
  <text x="712" y="560" font-size="12.5" fill="#64748b">Decoding reads what a cert claims; verifying trust (signature, chain, revocation) is separate.</text>

  <text x="600" y="612" text-anchor="middle" font-size="13" fill="#7c3aed" font-weight="600">X.509 = the schema  |  ASN.1 = the abstract structure  |  DER = the bytes  |  PEM = the text envelope</text>

  <text x="600" y="678" text-anchor="middle" font-size="14" fill="#94a3b8">lazytools.io/security/certificate-decoder/</text>
</svg>
