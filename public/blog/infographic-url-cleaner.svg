<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="A long URL example.com slash article with a functional id parameter plus tracking parameters utm_source, utm_medium, utm_campaign, fbclid and gclid. The tracking parameters are removed, leaving the clean short URL example.com slash article with only the id parameter kept.">
  <defs>
    <style>
      .h { font: 800 42px 'Plus Jakarta Sans','Segoe UI',Arial,sans-serif; fill: #0f172a; }
      .cap { font: 800 28px 'Plus Jakarta Sans','Segoe UI',Arial,sans-serif; fill: #334155; }
      .code { font: 700 25px Consolas,Menlo,monospace; fill: #0f172a; }
      .codew { font: 700 26px Consolas,Menlo,monospace; fill: #ffffff; }
      .keep { font: 700 24px Consolas,Menlo,monospace; fill: #059669; }
      .drop { font: 700 24px Consolas,Menlo,monospace; fill: #dc2626; }
      .lab { font: 600 25px 'Plus Jakarta Sans','Segoe UI',Arial,sans-serif; fill: #334155; }
      .foot { font: 600 26px Consolas,Menlo,monospace; fill: #ffffff; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="700" fill="#f8fafc"/>
  <text x="600" y="62" text-anchor="middle" class="h">Clean the tracking out of a link</text>

  <!-- messy url -->
  <g transform="translate(60 100)">
    <rect x="0" y="0" width="1080" height="190" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="3"/>
    <text x="30" y="44" class="cap">Before</text>
    <text x="30" y="90" class="code">example.com/article</text>
    <text x="30" y="128" class="keep">?id=482</text>
    <text x="150" y="128" class="drop">&amp;utm_source=newsletter&amp;utm_medium=email</text>
    <text x="30" y="162" class="drop">&amp;utm_campaign=autumn&amp;fbclid=IwAR0xyz&amp;gclid=Cj0kC</text>
  </g>

  <!-- legend -->
  <g transform="translate(60 312)">
    <rect x="0" y="0" width="30" height="30" rx="6" fill="#059669"/>
    <text x="42" y="23" class="lab">functional (kept)</text>
    <rect x="320" y="0" width="30" height="30" rx="6" fill="#dc2626"/>
    <text x="362" y="23" class="lab">tracking (removed)</text>
  </g>

  <!-- arrow -->
  <polygon points="578,364 622,364 600,398" fill="#1e3a8a"/>

  <!-- clean url -->
  <g transform="translate(60 420)">
    <rect x="0" y="0" width="1080" height="120" rx="18" fill="#0c3f85" stroke="#1d87f1" stroke-width="3"/>
    <text x="30" y="46" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="28" font-weight="800" fill="#7ef0c0">After</text>
    <text x="30" y="92" class="codew">example.com/article?id=482</text>
  </g>

  <text x="600" y="596" text-anchor="middle" class="lab">Strips utm_* , fbclid, gclid, mc_eid, igshid&#8230; &#183; keeps functional params and #fragment</text>

  <rect x="330" y="626" width="540" height="50" rx="14" fill="#1e3a8a"/>
  <text x="600" y="660" text-anchor="middle" class="foot">lazytools.io/links</text>
</svg>
