<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1200" height="700" fill="#f8fafc"/>
  <text x="60" y="58" font-size="30" font-weight="700" fill="#0f172a">The refinance break-even point</text>
  <text x="60" y="88" font-size="18" fill="#64748b">Closing costs $4,500  ·  monthly saving $250  ·  break-even = 4,500 divided by 250 = month 18</text>

  <!-- axes -->
  <line x1="120" y1="120" x2="120" y2="600" stroke="#94a3b8" stroke-width="2"/>
  <line x1="120" y1="600" x2="1120" y2="600" stroke="#94a3b8" stroke-width="2"/>
  <text x="60" y="130" font-size="15" fill="#64748b">dollars</text>
  <text x="1060" y="628" font-size="15" fill="#64748b">months</text>

  <!-- y gridlines -->
  <text x="70" y="365" font-size="14" fill="#94a3b8">$4.5k</text>
  <text x="78" y="125" font-size="14" fill="#94a3b8">$9k</text>

  <!-- pure-savings region (after break-even, above the closing-costs line) -->
  <polygon points="620,360 1120,120 1120,360" fill="#22c55e" fill-opacity="0.16"/>

  <!-- closing-costs flat line -->
  <line x1="120" y1="360" x2="1120" y2="360" stroke="#d97706" stroke-width="3" stroke-dasharray="9 6"/>
  <text x="132" y="350" font-size="16" font-weight="700" fill="#b45309">$4,500 closing costs</text>

  <!-- accumulated savings line -->
  <line x1="120" y1="600" x2="1120" y2="120" stroke="#1d87f1" stroke-width="4"/>
  <text x="880" y="210" font-size="16" font-weight="700" fill="#1d87f1">accumulated savings</text>
  <text x="880" y="232" font-size="14" fill="#334155">$250 per month</text>

  <!-- break-even marker -->
  <line x1="620" y1="360" x2="620" y2="600" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="5 5"/>
  <circle cx="620" cy="360" r="8" fill="#0f172a"/>
  <text x="636" y="345" font-size="17" font-weight="700" fill="#0f172a">Break-even: month 18</text>
  <text x="600" y="624" font-size="14" fill="#334155">18</text>

  <!-- region labels -->
  <text x="300" y="520" font-size="15" fill="#b45309">still recouping costs</text>
  <text x="820" y="300" font-size="15" font-weight="700" fill="#15803d">pure saving</text>

  <text x="60" y="668" font-size="15" fill="#94a3b8">Keep the loan past the break-even month to come out ahead  ·  lazytools.io/finance/mortgage-refinance-calculator</text>
</svg>
