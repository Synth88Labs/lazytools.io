<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="An original image with a blue crop box overlay is cropped down to just the region inside the box. Below, aspect-ratio chips show 1:1 square, 16:9 thumbnail, 4:5 Instagram portrait and 9:16 story.">
  <rect width="1200" height="700" fill="#f8fafc"/>

  <!-- Title -->
  <text x="600" y="66" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#0f172a">Crop keeps a region &#8594; discards the rest</text>

  <!-- Original card -->
  <g>
    <rect x="70" y="120" width="420" height="300" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="3"/>
    <!-- picture backdrop -->
    <rect x="94" y="144" width="372" height="220" rx="8" fill="#e2e8f0"/>
    <circle cx="200" cy="250" r="46" fill="#bfdbfe"/>
    <rect x="270" y="300" width="160" height="18" rx="9" fill="#cbd5e1"/>
    <rect x="270" y="330" width="110" height="18" rx="9" fill="#cbd5e1"/>
    <!-- crop box overlay -->
    <rect x="150" y="180" width="190" height="150" fill="none" stroke="#1e3a8a" stroke-width="6"/>
    <rect x="141" y="171" width="18" height="18" fill="#1e3a8a"/>
    <rect x="331" y="171" width="18" height="18" fill="#1e3a8a"/>
    <rect x="141" y="321" width="18" height="18" fill="#1e3a8a"/>
    <rect x="331" y="321" width="18" height="18" fill="#1e3a8a"/>
    <text x="280" y="405" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="600" fill="#334155">Original + crop box</text>
  </g>

  <!-- Arrow -->
  <g>
    <line x1="520" y1="270" x2="650" y2="270" stroke="#1e3a8a" stroke-width="8" stroke-linecap="round"/>
    <polygon points="650,250 692,270 650,290" fill="#1e3a8a"/>
  </g>

  <!-- Result card -->
  <g>
    <rect x="710" y="150" width="300" height="240" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="3"/>
    <rect x="734" y="174" width="252" height="150" rx="8" fill="#e2e8f0"/>
    <circle cx="810" cy="250" r="46" fill="#1e3a8a"/>
    <rect x="880" y="230" width="80" height="16" rx="8" fill="#94a3b8"/>
    <rect x="880" y="258" width="60" height="16" rx="8" fill="#94a3b8"/>
    <text x="860" y="365" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1e3a8a">Cropped result</text>
  </g>

  <!-- Lossless note -->
  <text x="600" y="470" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" fill="#334155">Lossless for kept pixels &#183; nothing rescaled &#183; stays sharp</text>

  <!-- Aspect-ratio chips -->
  <text x="600" y="540" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="600" fill="#0f172a">Lock to an aspect ratio</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="36" font-weight="700">
    <rect x="140" y="566" width="200" height="72" rx="14" fill="#ffffff" stroke="#1e3a8a" stroke-width="3"/>
    <text x="240" y="603" text-anchor="middle" fill="#1e3a8a">1:1</text>
    <text x="240" y="632" text-anchor="middle" font-size="24" font-weight="500" fill="#334155">avatar</text>

    <rect x="368" y="566" width="200" height="72" rx="14" fill="#ffffff" stroke="#1e3a8a" stroke-width="3"/>
    <text x="468" y="603" text-anchor="middle" fill="#1e3a8a">16:9</text>
    <text x="468" y="632" text-anchor="middle" font-size="24" font-weight="500" fill="#334155">thumbnail</text>

    <rect x="596" y="566" width="200" height="72" rx="14" fill="#ffffff" stroke="#1e3a8a" stroke-width="3"/>
    <text x="696" y="603" text-anchor="middle" fill="#1e3a8a">4:5</text>
    <text x="696" y="632" text-anchor="middle" font-size="24" font-weight="500" fill="#334155">IG portrait</text>

    <rect x="824" y="566" width="200" height="72" rx="14" fill="#ffffff" stroke="#1e3a8a" stroke-width="3"/>
    <text x="924" y="603" text-anchor="middle" fill="#1e3a8a">9:16</text>
    <text x="924" y="632" text-anchor="middle" font-size="24" font-weight="500" fill="#334155">story</text>
  </g>

  <!-- Footer -->
  <text x="600" y="686" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#1e3a8a">lazytools.io/image/crop-image</text>
</svg>
