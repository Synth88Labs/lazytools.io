<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-label="A Google Drive share link drive.google.com slash file slash d slash FILE underscore ID slash view opens a preview page. Extracting the FILE ID and placing it into drive.google.com slash uc question mark export equals download and id equals FILE ID produces a direct download link that downloads the file.">
  <defs>
    <style>
      .h { font: 800 42px 'Plus Jakarta Sans','Segoe UI',Arial,sans-serif; fill: #0f172a; }
      .cap { font: 800 30px 'Plus Jakarta Sans','Segoe UI',Arial,sans-serif; fill: #1e3a8a; }
      .lab { font: 600 26px 'Plus Jakarta Sans','Segoe UI',Arial,sans-serif; fill: #334155; }
      .code { font: 700 25px Consolas,Menlo,monospace; fill: #0f172a; }
      .codew { font: 700 25px Consolas,Menlo,monospace; fill: #ffffff; }
      .foot { font: 600 26px Consolas,Menlo,monospace; fill: #ffffff; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="680" fill="#f8fafc"/>
  <text x="600" y="64" text-anchor="middle" class="h">Google Drive: share link &#8594; direct download</text>

  <!-- share link card -->
  <g transform="translate(60 110)">
    <rect x="0" y="0" width="1080" height="150" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="3"/>
    <text x="30" y="46" class="cap">Share link (opens a preview)</text>
    <rect x="30" y="66" width="1020" height="58" rx="10" fill="#f1f5f9"/>
    <text x="48" y="104" class="code">drive.google.com/file/d/<tspan fill="#dc2626" font-weight="800">1A2b3C4d5E6f7G8h9I0jKlMnOpQr</tspan>/view</text>
  </g>

  <!-- arrow + extract -->
  <g transform="translate(600 290)">
    <text x="0" y="24" text-anchor="middle" class="lab">extract the file ID (25+ characters)</text>
    <polygon points="-22,36 22,36 0,70" fill="#1e3a8a"/>
  </g>

  <!-- direct link card -->
  <g transform="translate(60 380)">
    <rect x="0" y="0" width="1080" height="150" rx="18" fill="#0c3f85" stroke="#1d87f1" stroke-width="3"/>
    <text x="30" y="46" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="30" font-weight="800" fill="#7ef0c0">Direct download link (downloads the file)</text>
    <rect x="30" y="66" width="1020" height="58" rx="10" fill="#0a2d5f"/>
    <text x="48" y="104" class="codew">drive.google.com/uc?export=download&amp;id=<tspan fill="#7ef0c0" font-weight="800">1A2b3C4d5E6f7G8h9I0jKlMnOpQr</tspan></text>
  </g>

  <!-- note -->
  <text x="600" y="578" text-anchor="middle" class="lab">File must be shared as &#8220;Anyone with the link&#8221; &#183; Docs/Sheets/Slides use /export?format=&#8230;</text>

  <!-- footer -->
  <rect x="330" y="608" width="540" height="50" rx="14" fill="#1e3a8a"/>
  <text x="600" y="642" text-anchor="middle" class="foot">lazytools.io/links</text>
</svg>
