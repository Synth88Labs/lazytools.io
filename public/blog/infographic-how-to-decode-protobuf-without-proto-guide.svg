<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="tagGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="700" fill="#f8fafc"/>

  <!-- Title -->
  <text x="60" y="58" font-size="30" font-weight="700" fill="#0f172a">Decode Protobuf Without the .proto Schema</text>
  <text x="60" y="90" font-size="17" fill="#64748b">The wire format is self-describing: every field carries its own number and type. Example bytes: 08 96 01</text>

  <!-- Raw bytes strip -->
  <text x="60" y="140" font-size="16" font-weight="700" fill="#334155">Raw message bytes (hex)</text>
  <g font-family="Consolas, Courier New, monospace">
    <rect x="60" y="152" width="150" height="60" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="135" y="190" font-size="26" font-weight="700" fill="#92400e" text-anchor="middle">08</text>
    <rect x="222" y="152" width="150" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="297" y="190" font-size="26" font-weight="700" fill="#166534" text-anchor="middle">96</text>
    <rect x="384" y="152" width="150" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="459" y="190" font-size="26" font-weight="700" fill="#166534" text-anchor="middle">01</text>
  </g>
  <text x="135" y="234" font-size="14" fill="#d97706" text-anchor="middle" font-weight="700">TAG byte</text>
  <text x="378" y="234" font-size="14" fill="#16a34a" text-anchor="middle" font-weight="700">VALUE (varint)</text>

  <!-- Tag breakdown -->
  <text x="620" y="140" font-size="16" font-weight="700" fill="#334155">The tag byte splits into two parts</text>
  <rect x="620" y="152" width="520" height="130" rx="10" fill="url(#tagGrad)" stroke="#1d87f1" stroke-width="2"/>
  <text x="640" y="182" font-size="17" fill="#0f172a">tag = (field_number shift-left 3) OR wire_type</text>

  <!-- bit boxes for 0x08 = 0000 1000 -->
  <g font-family="Consolas, Courier New, monospace">
    <text x="640" y="222" font-size="14" fill="#64748b">0x08 =</text>
    <rect x="710" y="205" width="34" height="34" fill="#ffffff" stroke="#94a3b8"/>
    <text x="727" y="229" font-size="18" fill="#0f172a" text-anchor="middle">0</text>
    <rect x="744" y="205" width="34" height="34" fill="#ffffff" stroke="#94a3b8"/>
    <text x="761" y="229" font-size="18" fill="#0f172a" text-anchor="middle">0</text>
    <rect x="778" y="205" width="34" height="34" fill="#ffffff" stroke="#94a3b8"/>
    <text x="795" y="229" font-size="18" fill="#0f172a" text-anchor="middle">0</text>
    <rect x="812" y="205" width="34" height="34" fill="#e0e7ff" stroke="#7c3aed"/>
    <text x="829" y="229" font-size="18" fill="#7c3aed" text-anchor="middle" font-weight="700">1</text>
    <rect x="846" y="205" width="34" height="34" fill="#e0e7ff" stroke="#7c3aed"/>
    <text x="863" y="229" font-size="18" fill="#7c3aed" text-anchor="middle" font-weight="700">0</text>
    <!-- low 3 bits wire type -->
    <rect x="880" y="205" width="34" height="34" fill="#fee2e2" stroke="#dc2626"/>
    <text x="897" y="229" font-size="18" fill="#dc2626" text-anchor="middle" font-weight="700">0</text>
    <rect x="914" y="205" width="34" height="34" fill="#fee2e2" stroke="#dc2626"/>
    <text x="931" y="229" font-size="18" fill="#dc2626" text-anchor="middle" font-weight="700">0</text>
    <rect x="948" y="205" width="34" height="34" fill="#fee2e2" stroke="#dc2626"/>
    <text x="965" y="229" font-size="18" fill="#dc2626" text-anchor="middle" font-weight="700">0</text>
  </g>
  <text x="829" y="270" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="700">field number = 1</text>
  <text x="931" y="270" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="700">wire type = 0</text>

  <!-- Divider -->
  <line x1="60" y1="310" x2="1140" y2="310" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Four wire types -->
  <text x="60" y="348" font-size="18" font-weight="700" fill="#0f172a">The four wire types (low 3 bits of the tag)</text>

  <g>
    <rect x="60" y="366" width="255" height="118" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <circle cx="92" cy="398" r="18" fill="#dc2626"/>
    <text x="92" y="404" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">0</text>
    <text x="122" y="392" font-size="18" fill="#0f172a" font-weight="700">varint</text>
    <text x="122" y="414" font-size="13" fill="#64748b">base-128 integer</text>
    <text x="80" y="448" font-size="13" fill="#334155">int32/64, uint, bool,</text>
    <text x="80" y="468" font-size="13" fill="#334155">enum, sint (zigzag)</text>
  </g>
  <g>
    <rect x="333" y="366" width="255" height="118" rx="10" fill="#ffffff" stroke="#1d87f1" stroke-width="2"/>
    <circle cx="365" cy="398" r="18" fill="#1d87f1"/>
    <text x="365" y="404" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
    <text x="395" y="392" font-size="18" fill="#0f172a" font-weight="700">I64</text>
    <text x="395" y="414" font-size="13" fill="#64748b">8 fixed bytes</text>
    <text x="353" y="448" font-size="13" fill="#334155">fixed64, sfixed64,</text>
    <text x="353" y="468" font-size="13" fill="#334155">double</text>
  </g>
  <g>
    <rect x="606" y="366" width="255" height="118" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <circle cx="638" cy="398" r="18" fill="#16a34a"/>
    <text x="638" y="404" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
    <text x="668" y="392" font-size="18" fill="#0f172a" font-weight="700">LEN</text>
    <text x="668" y="414" font-size="13" fill="#64748b">length varint plus bytes</text>
    <text x="626" y="448" font-size="13" fill="#334155">string, bytes, embedded</text>
    <text x="626" y="468" font-size="13" fill="#334155">message, packed repeated</text>
  </g>
  <g>
    <rect x="879" y="366" width="261" height="118" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <circle cx="911" cy="398" r="18" fill="#7c3aed"/>
    <text x="911" y="404" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">5</text>
    <text x="941" y="392" font-size="18" fill="#0f172a" font-weight="700">I32</text>
    <text x="941" y="414" font-size="13" fill="#64748b">4 fixed bytes</text>
    <text x="899" y="448" font-size="13" fill="#334155">fixed32, sfixed32,</text>
    <text x="899" y="468" font-size="13" fill="#334155">float</text>
  </g>

  <!-- Decoded output -->
  <text x="60" y="528" font-size="18" font-weight="700" fill="#0f172a">Schema-less decode of 08 96 01</text>
  <rect x="60" y="544" width="500" height="110" rx="10" fill="#0f172a"/>
  <g font-family="Consolas, Courier New, monospace">
    <text x="82" y="580" font-size="17" fill="#7dd3fc">1</text>
    <text x="98" y="580" font-size="17" fill="#e2e8f0">: 150</text>
    <text x="330" y="580" font-size="15" fill="#94a3b8">(field 1, varint)</text>
    <text x="82" y="612" font-size="14" fill="#64748b">// value byte 96 01 decodes as</text>
    <text x="82" y="636" font-size="14" fill="#64748b">// varint 150 (little-endian, 7 bits/byte)</text>
  </g>

  <!-- Recoverable vs not -->
  <g>
    <rect x="588" y="544" width="552" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="610" y="574" font-size="15" fill="#16a34a" font-weight="700">Recoverable without .proto</text>
    <text x="610" y="598" font-size="14" fill="#334155">field number, wire type, raw value bytes</text>
    <text x="610" y="624" font-size="15" fill="#dc2626" font-weight="700">Not recoverable</text>
    <text x="610" y="646" font-size="14" fill="#334155">field names, int vs bool vs enum, string vs message</text>
  </g>

  <!-- arrows connecting tag to value -->
  <line x1="459" y1="212" x2="459" y2="226" stroke="#16a34a" stroke-width="2"/>

  <text x="60" y="686" font-size="14" fill="#94a3b8">lazytools.io/dev/protobuf-decoder/</text>
</svg>
