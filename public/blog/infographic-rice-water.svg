<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Water-to-rice ratios by rice type, absorption method: white long-grain 2 to 1, brown rice 2.5 to 1, basmati 1.5 to 1, sushi rice 1.25 to 1, wild rice 3 to 1.">
  <rect width="1200" height="700" fill="#f8fafc"/>

  <text x="60" y="78" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#0f172a">Water : Rice</text>
  <text x="60" y="118" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#334155">Absorption method &#8212; water fully soaked up, by rice type</text>

  <!-- Row 1: White -->
  <rect x="60" y="150" width="1080" height="86" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="96" y="204" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#0f172a">White long-grain</text>
  <text x="1104" y="205" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#b45309">2 : 1</text>

  <!-- Row 2: Brown -->
  <rect x="60" y="252" width="1080" height="86" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="96" y="306" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#0f172a">Brown rice</text>
  <text x="1104" y="307" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#b45309">2.5 : 1</text>

  <!-- Row 3: Basmati -->
  <rect x="60" y="354" width="1080" height="86" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="96" y="408" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#0f172a">Basmati / Jasmine</text>
  <text x="1104" y="409" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#b45309">1.5 : 1</text>

  <!-- Row 4: Sushi -->
  <rect x="60" y="456" width="1080" height="86" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="96" y="510" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#0f172a">Sushi rice</text>
  <text x="1104" y="511" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#b45309">1.25 : 1</text>

  <!-- Row 5: Wild -->
  <rect x="60" y="558" width="1080" height="86" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="96" y="612" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#0f172a">Wild rice</text>
  <text x="1104" y="613" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#b45309">3 : 1</text>

  <text x="60" y="682" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#334155">lazytools.io/cooking/rice-water-ratio-calculator</text>
</svg>
