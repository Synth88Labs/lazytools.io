<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="BMI equals weight in kilograms divided by height in metres squared. Worked example: 70 divided by 1.75 squared equals 22.9. WHO adult categories: under 18.5 underweight, 18.5 to 24.9 normal weight, 25.0 to 29.9 overweight, 30.0 and above obesity.">
  <rect x="0" y="0" width="1200" height="700" fill="#f8fafc"/>

  <text x="600" y="66" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#0f172a">How to calculate BMI</text>

  <!-- Formula card -->
  <rect x="60" y="100" width="1080" height="150" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="600" y="176" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#1e3a8a">BMI = weight(kg) &#247; height(m)&#178;</text>
  <text x="600" y="222" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#334155">Imperial: weight(lb) &#247; height(in)&#178; &#215; 703 &#8594; same result</text>

  <!-- Worked example card -->
  <rect x="60" y="284" width="1080" height="128" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="600" y="345" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#0f172a">70 &#247; 1.75&#178; = 70 &#247; 3.0625 = 22.9</text>
  <text x="600" y="388" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="25" fill="#166534" font-weight="600">70 kg at 1.75 m &#8594; a healthy-range BMI of 22.9</text>

  <!-- WHO categories -->
  <text x="600" y="470" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">WHO adult categories</text>

  <!-- Category bar: 4 segments -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="60" y="500" width="255" height="96" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="187" y="540" text-anchor="middle" font-size="32" font-weight="700" fill="#1e3a8a">&lt; 18.5</text>
    <text x="187" y="576" text-anchor="middle" font-size="24" fill="#334155">Underweight</text>

    <rect x="330" y="500" width="255" height="96" rx="12" fill="#ffffff" stroke="#166534" stroke-width="3"/>
    <text x="457" y="540" text-anchor="middle" font-size="32" font-weight="700" fill="#166534">18.5&#8211;24.9</text>
    <text x="457" y="576" text-anchor="middle" font-size="24" fill="#166534">Normal weight</text>

    <rect x="600" y="500" width="255" height="96" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="727" y="540" text-anchor="middle" font-size="32" font-weight="700" fill="#1e3a8a">25.0&#8211;29.9</text>
    <text x="727" y="576" text-anchor="middle" font-size="24" fill="#334155">Overweight</text>

    <rect x="870" y="500" width="270" height="96" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="1005" y="540" text-anchor="middle" font-size="32" font-weight="700" fill="#1e3a8a">30.0 +</text>
    <text x="1005" y="576" text-anchor="middle" font-size="24" fill="#334155">Obesity</text>
  </g>

  <text x="600" y="646" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="23" fill="#334155">Screening tool, not a diagnosis &#183; can't tell muscle from fat &#183; ranges: World Health Organization</text>

  <text x="600" y="682" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#1e3a8a">lazytools.io/calc/bmi-calculator</text>
</svg>
