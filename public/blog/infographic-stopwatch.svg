<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-label="A stopwatch lap table. Lap time is each segment; split time is the cumulative total. Each lap equals the current split minus the previous split.">
  <defs>
    <style>
      .h { font: 800 44px 'Plus Jakarta Sans','Segoe UI',Arial,sans-serif; fill: #0f172a; }
      .th { font: 700 24px 'Plus Jakarta Sans','Segoe UI',Arial,sans-serif; fill: #64748b; }
      .cell { font: 700 26px Consolas,Menlo,monospace; fill: #0f172a; }
      .cap { font: 800 24px 'Plus Jakarta Sans','Segoe UI',Arial,sans-serif; fill: #1e3a8a; }
      .lab { font: 600 24px 'Plus Jakarta Sans','Segoe UI',Arial,sans-serif; fill: #475569; }
      .foot { font: 600 26px Consolas,Menlo,monospace; fill: #ffffff; }
    </style>
  </defs>
  <rect x="0" y="0" width="1200" height="680" fill="#f8fafc"/>
  <text x="600" y="60" text-anchor="middle" class="h">Lap vs split time</text>

  <text x="600" y="120" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="56" font-weight="800" fill="#0f172a">04:04.00</text>

  <!-- table -->
  <g transform="translate(200 170)">
    <rect x="0" y="0" width="800" height="300" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <text x="60" y="52" class="th">Lap</text>
    <text x="360" y="52" text-anchor="middle" class="cap">Lap time</text>
    <text x="680" y="52" text-anchor="middle" class="cap">Split</text>
    <text x="360" y="80" text-anchor="middle" class="lab">(segment)</text>
    <text x="680" y="80" text-anchor="middle" class="lab">(total)</text>
    <line x1="20" y1="96" x2="780" y2="96" stroke="#e2e8f0"/>
    <g>
      <text x="60" y="140" class="cell">#1</text><text x="360" y="140" text-anchor="middle" class="cell">1:02</text><text x="680" y="140" text-anchor="middle" class="cell">1:02</text>
      <text x="60" y="186" class="cell">#2</text><text x="360" y="186" text-anchor="middle" class="cell">1:03</text><text x="680" y="186" text-anchor="middle" class="cell">2:05</text>
      <text x="60" y="232" class="cell">#3</text><text x="360" y="232" text-anchor="middle" class="cell">1:01</text><text x="680" y="232" text-anchor="middle" class="cell">3:06</text>
      <text x="60" y="278" class="cell">#4</text><text x="360" y="278" text-anchor="middle" class="cell">0:58</text><text x="680" y="278" text-anchor="middle" class="cell">4:04</text>
    </g>
  </g>

  <text x="600" y="520" text-anchor="middle" class="lab">each lap = current split &#8722; previous split (2:05 &#8722; 1:02 = 1:03)</text>

  <rect x="350" y="574" width="500" height="52" rx="14" fill="#1e3a8a"/>
  <text x="600" y="609" text-anchor="middle" class="foot">lazytools.io/productivity/stopwatch</text>
</svg>
