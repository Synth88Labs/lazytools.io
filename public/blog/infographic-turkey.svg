<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="Turkey timing: thaw in the fridge about 24 hours per 4 to 5 pounds; roast at 325 Fahrenheit about 13 minutes per pound unstuffed; always cook to 165 Fahrenheit.">
  <rect width="1200" height="700" fill="#f8fafc"/>
  <text x="600" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="43" font-weight="800" fill="#0f172a">Turkey timing, by the numbers</text>
  <text x="600" y="102" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" fill="#475569">Thaw and roast times scale with weight — but doneness is a temperature.</text>

  <g font-family="system-ui, sans-serif">
    <rect x="70" y="150" width="345" height="230" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="3"/>
    <text x="242" y="196" text-anchor="middle" font-size="25" font-weight="800" fill="#1e3a8a">Fridge thaw</text>
    <text x="242" y="252" text-anchor="middle" font-size="22" fill="#334155">~24 hours per</text>
    <text x="242" y="284" text-anchor="middle" font-size="22" fill="#334155">4&#8211;5 pounds</text>
    <text x="242" y="344" text-anchor="middle" font-family="ui-monospace, monospace" font-size="24" font-weight="700" fill="#0f172a">15 lb &#8594; 3&#8211;4 days</text>

    <rect x="427" y="150" width="346" height="230" rx="16" fill="#ffffff" stroke="#fed7aa" stroke-width="3"/>
    <text x="600" y="196" text-anchor="middle" font-size="25" font-weight="800" fill="#9a3412">Cold-water thaw</text>
    <text x="600" y="252" text-anchor="middle" font-size="22" fill="#334155">~30 minutes</text>
    <text x="600" y="284" text-anchor="middle" font-size="22" fill="#334155">per pound</text>
    <text x="600" y="344" text-anchor="middle" font-family="ui-monospace, monospace" font-size="24" font-weight="700" fill="#0f172a">15 lb &#8594; ~7.5 hrs</text>

    <rect x="785" y="150" width="345" height="230" rx="16" fill="#ffffff" stroke="#bbf7d0" stroke-width="3"/>
    <text x="957" y="196" text-anchor="middle" font-size="25" font-weight="800" fill="#166534">Roast at 325&#176;F</text>
    <text x="957" y="252" text-anchor="middle" font-size="22" fill="#334155">~13 min/lb unstuffed</text>
    <text x="957" y="284" text-anchor="middle" font-size="22" fill="#334155">~15 min/lb stuffed</text>
    <text x="957" y="344" text-anchor="middle" font-family="ui-monospace, monospace" font-size="24" font-weight="700" fill="#0f172a">15 lb &#8594; ~3.25 hrs</text>
  </g>

  <g>
    <rect x="70" y="410" width="1060" height="150" rx="16" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
    <text x="600" y="458" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#991b1b">Done = 165&#176;F (74&#176;C)</text>
    <text x="600" y="498" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" fill="#334155">Measure the thickest part of the breast and the innermost thigh, away from bone.</text>
    <text x="600" y="528" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" fill="#334155">Times are estimates; the thermometer is what tells you it\'s safe. Never thaw at room temp.</text>
  </g>
  <text x="600" y="616" text-anchor="middle" font-family="system-ui, sans-serif" font-size="21" fill="#64748b">Let it rest 20&#8211;30 minutes before carving.</text>
  <text x="600" y="662" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#94a3b8">lazytools.io/cooking/turkey-cooking-time-calculator</text>
</svg>
