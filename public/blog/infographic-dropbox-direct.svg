<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-label="Three versions of a Dropbox link. With dl equals 0 on www.dropbox.com it opens a preview. With dl equals 1 on www.dropbox.com it downloads the file. On the host dl.dropboxusercontent.com it serves the raw bytes for embedding. The rlkey token is kept in all versions.">
  <defs>
    <style>
      .h { font: 800 42px 'Plus Jakarta Sans','Segoe UI',Arial,sans-serif; fill: #0f172a; }
      .ct { font: 800 30px 'Plus Jakarta Sans','Segoe UI',Arial,sans-serif; fill: #ffffff; }
      .lab { font: 600 25px 'Plus Jakarta Sans','Segoe UI',Arial,sans-serif; fill: #e0edff; }
      .labd { font: 600 25px 'Plus Jakarta Sans','Segoe UI',Arial,sans-serif; fill: #334155; }
      .code { font: 700 22px Consolas,Menlo,monospace; fill: #0f172a; }
      .foot { font: 600 26px Consolas,Menlo,monospace; fill: #ffffff; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="680" fill="#f8fafc"/>
  <text x="600" y="62" text-anchor="middle" class="h">One Dropbox link, three behaviours</text>

  <!-- preview -->
  <g transform="translate(60 100)">
    <rect x="0" y="0" width="1080" height="130" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="3"/>
    <rect x="0" y="0" width="300" height="130" rx="18" fill="#64748b"/>
    <text x="150" y="58" text-anchor="middle" class="ct">Preview</text>
    <text x="150" y="92" text-anchor="middle" class="lab">dl=0</text>
    <rect x="326" y="36" width="724" height="58" rx="10" fill="#f1f5f9"/>
    <text x="344" y="72" class="code">www.dropbox.com/scl/fi/&#8230;?rlkey=xyz&amp;<tspan fill="#64748b" font-weight="800">dl=0</tspan></text>
  </g>

  <!-- direct download -->
  <g transform="translate(60 250)">
    <rect x="0" y="0" width="1080" height="130" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="3"/>
    <rect x="0" y="0" width="300" height="130" rx="18" fill="#1e3a8a"/>
    <text x="150" y="58" text-anchor="middle" class="ct">Download</text>
    <text x="150" y="92" text-anchor="middle" class="lab">dl=1</text>
    <rect x="326" y="36" width="724" height="58" rx="10" fill="#eff6ff"/>
    <text x="344" y="72" class="code">www.dropbox.com/scl/fi/&#8230;?rlkey=xyz&amp;<tspan fill="#1e3a8a" font-weight="800">dl=1</tspan></text>
  </g>

  <!-- raw host -->
  <g transform="translate(60 400)">
    <rect x="0" y="0" width="1080" height="130" rx="18" fill="#ffffff" stroke="#bbf7d0" stroke-width="3"/>
    <rect x="0" y="0" width="300" height="130" rx="18" fill="#059669"/>
    <text x="150" y="58" text-anchor="middle" class="ct">Raw / embed</text>
    <text x="150" y="92" text-anchor="middle" class="lab">no dl</text>
    <rect x="326" y="36" width="724" height="58" rx="10" fill="#ecfdf5"/>
    <text x="344" y="72" class="code"><tspan fill="#059669" font-weight="800">dl.dropboxusercontent.com</tspan>/scl/fi/&#8230;?rlkey=xyz</text>
  </g>

  <text x="600" y="578" text-anchor="middle" class="labd">Keep the rlkey token on /scl/fi/ links &#183; Dropbox is not a CDN</text>

  <rect x="330" y="608" width="540" height="50" rx="14" fill="#1e3a8a"/>
  <text x="600" y="642" text-anchor="middle" class="foot">lazytools.io/links</text>
</svg>
