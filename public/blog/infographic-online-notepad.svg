<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1200" height="700" fill="#f8fafc"/>
  <text x="600" y="56" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">Where does an online notepad save your text?</text>
  <line x1="600" y1="90" x2="600" y2="640" stroke="#e2e8f0" stroke-width="2"/>

  <!-- LEFT: cloud notepad -->
  <text x="300" y="130" text-anchor="middle" font-size="23" font-weight="700" fill="#b45309">Cloud notepad</text>
  <!-- note box -->
  <rect x="200" y="160" width="200" height="120" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="222" y1="192" x2="378" y2="192" stroke="#e2e8f0" stroke-width="3"/>
  <line x1="222" y1="216" x2="378" y2="216" stroke="#e2e8f0" stroke-width="3"/>
  <line x1="222" y1="240" x2="330" y2="240" stroke="#e2e8f0" stroke-width="3"/>
  <text x="300" y="150" text-anchor="middle" font-size="13" fill="#64748b">your typing</text>
  <!-- arrow up over the internet -->
  <line x1="300" y1="290" x2="300" y2="360" stroke="#d97706" stroke-width="3" marker-end="url(#ar)"/>
  <text x="318" y="330" font-size="14" fill="#b45309">uploaded over</text>
  <text x="318" y="348" font-size="14" fill="#b45309">the internet</text>
  <!-- cloud + server -->
  <ellipse cx="300" cy="420" rx="95" ry="45" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="300" y="415" text-anchor="middle" font-size="16" font-weight="700" fill="#b45309">their server</text>
  <text x="300" y="437" text-anchor="middle" font-size="13" fill="#92400e">stored + account</text>
  <text x="300" y="520" text-anchor="middle" font-size="15" fill="#334155">A copy now lives off your device —</text>
  <text x="300" y="540" text-anchor="middle" font-size="15" fill="#334155">it can be breached, scanned or subpoenaed.</text>

  <!-- RIGHT: browser notepad -->
  <text x="900" y="130" text-anchor="middle" font-size="23" font-weight="700" fill="#15803d">Browser-only notepad</text>
  <rect x="800" y="160" width="200" height="120" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="822" y1="192" x2="978" y2="192" stroke="#e2e8f0" stroke-width="3"/>
  <line x1="822" y1="216" x2="978" y2="216" stroke="#e2e8f0" stroke-width="3"/>
  <line x1="822" y1="240" x2="930" y2="240" stroke="#e2e8f0" stroke-width="3"/>
  <text x="900" y="150" text-anchor="middle" font-size="13" fill="#64748b">your typing</text>
  <line x1="900" y1="290" x2="900" y2="360" stroke="#16a34a" stroke-width="3" marker-end="url(#ag)"/>
  <text x="918" y="330" font-size="14" fill="#15803d">saved on</text>
  <text x="918" y="348" font-size="14" fill="#15803d">this device</text>
  <!-- localStorage disk -->
  <rect x="805" y="378" width="190" height="84" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="900" y="412" text-anchor="middle" font-size="16" font-weight="700" fill="#15803d">localStorage</text>
  <text x="900" y="434" text-anchor="middle" font-size="13" fill="#166534">no network request</text>
  <text x="900" y="520" text-anchor="middle" font-size="15" fill="#334155">Nothing leaves your browser —</text>
  <text x="900" y="540" text-anchor="middle" font-size="15" fill="#334155">private, offline, no account. Export the .txt to keep it.</text>

  <text x="600" y="620" text-anchor="middle" font-size="15" fill="#94a3b8">lazytools.io/productivity/online-notepad</text>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d97706"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker>
  </defs>
</svg>
