# Continuous loop — Fixer + Developer + Manager "work all the time".
# GitHub Actions can't run truly nonstop, so this fires frequently (every 3h)
# and each run does a bounded, token-budgeted slice of work:
#   • Senior Fixer  — applies build-gated fixes to safe manual findings
#   • Developer     — drafts build-ready proposals for Manager-approved tools
#   • Manager       — reconciles SLAs, rates, guards the token budget, dashboard
# Needs ANTHROPIC_API_KEY; skips the LLM steps cleanly without it.
name: Continuous Dev & Fix

on:
  schedule:
    - cron: '20 */3 * * *'   # every 3 hours
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: audit-fix           # one lane — never races the daily/weekly loops
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Fixer — apply build-gated manual fixes
        id: fixllm
        run: node scripts/agent-fixer-llm.mjs

      - name: Developer — draft proposals for approved tools
        id: dev
        run: node scripts/agent-developer.mjs

      - name: Manager — reconcile + dashboard
        id: manage
        run: node scripts/audit-manager.mjs

      - name: Commit results
        run: |
          git config user.name  "lazytools-audit-bot"
          git config user.email "audit-bot@users.noreply.github.com"
          git add audits src
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "loop(${{ github.run_number }}): ${{ steps.fixllm.outputs.fixes_applied || 0 }} fix(es), ${{ steps.dev.outputs.dev_built || 0 }} proposal(s)"
            for i in 1 2 3 4 5; do
              git push && break
              echo "push rejected (attempt $i) — rebasing onto latest ${{ github.ref_name }}"
              git pull --rebase --autostash origin ${{ github.ref_name }} || { git rebase --abort || true; }
              sleep 3
            done
          fi

      - name: Deploy if the Fixer changed the site
        if: ${{ steps.fixllm.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml
