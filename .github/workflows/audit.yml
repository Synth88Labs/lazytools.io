# Daily UX audit of the live tools. Rotates through every tool page (10/day),
# runs a headless-Chromium user-experience audit against https://lazytools.io,
# and emails the report. Full catalogue is covered about every ~107 days, then
# it cycles.
#
# To receive the email, add three repo secrets
# (Settings -> Secrets and variables -> Actions):
#   MAIL_USERNAME   your Gmail address (e.g. synth88labs@gmail.com)
#   MAIL_PASSWORD   a Gmail *App Password* (Google Account -> Security ->
#                   2-Step Verification -> App passwords). NOT your login password.
#   AUDIT_EMAIL_TO  where to send the report (e.g. your own email)
# Without them the audit still runs and uploads the HTML report as a build
# artifact; it just won't email.
name: Daily UX Audit

on:
  schedule:
    - cron: '17 6 * * *'   # every day at 06:17 UTC
  workflow_dispatch:
    inputs:
      count:
        description: 'How many tools to audit this run'
        default: '10'
      offset:
        description: 'Rotation start index (blank = auto by date)'
        required: false

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      MAIL_ENABLED: ${{ secrets.MAIL_USERNAME != '' && secrets.MAIL_PASSWORD != '' && secrets.AUDIT_EMAIL_TO != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run UX audit
        id: audit
        env:
          AUDIT_SITE: https://lazytools.io
          AUDIT_COUNT: ${{ github.event.inputs.count || '10' }}
          AUDIT_OFFSET: ${{ github.event.inputs.offset }}
        run: node scripts/audit-ux.mjs
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-audit-report
          path: audit-report.html
          if-no-files-found: warn
      - name: Email report
        if: ${{ always() && env.MAIL_ENABLED == 'true' }}
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ${{ steps.audit.outputs.subject || 'LazyTools UX audit' }}
          to: ${{ secrets.AUDIT_EMAIL_TO }}
          from: LazyTools Auditor <${{ secrets.MAIL_USERNAME }}>
          html_body: file://audit-report.html
          priority: normal
      - name: Email not configured
        if: ${{ always() && env.MAIL_ENABLED != 'true' }}
        run: echo "::notice title=Email skipped::Add MAIL_USERNAME, MAIL_PASSWORD (Gmail App Password) and AUDIT_EMAIL_TO secrets to receive the audit by email. The report is attached as the 'ux-audit-report' artifact."
