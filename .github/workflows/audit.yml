# Autonomous daily audit-and-fix loop for lazytools.io. Runs token-free in CI.
#
#   Bot 1 (Auditor, scripts/audit-ux.mjs)  audits 10 rotating tools + any tool
#     awaiting verification, on the LIVE site (functionality, input/output, SEO,
#     content, accessibility via axe-core, performance, mobile, privacy). Updates
#     the git-tracked ledger (audits/ledger.json) and writes a dated report.
#   Bot 2 (Fixer, scripts/audit-fix.mjs)   applies safe, deterministic fixes to
#     open "auto" findings, gated by a full build (reverts on failure), marks
#     them "verifying", and compiles manual findings into recommendations.md.
#   Verification: the next day's Auditor re-tests "verifying" tools and marks
#     each complete, or logs a challenge with reasoning.
#
# Everything is committed back to the repo (public). See progress any time in
# audits/DASHBOARD.md (always-current), audits/reports/<date>.md, the ledger, and
# the run's job summary on the Actions page. No email — the git files are the record.
name: Daily UX Audit & Fix

on:
  schedule:
    - cron: '17 6 * * *'   # every day 06:17 UTC
  workflow_dispatch:
    inputs:
      count:
        description: 'Tools to audit this run'
        default: '10'
      offset:
        description: 'Rotation start index (blank = auto by date)'
        required: false

permissions:
  contents: write        # commit the ledger / reports / source fixes
  actions: write         # dispatch deploy.yml when a fix changes the site

concurrency:
  group: audit-fix
  cancel-in-progress: false

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    env:
      # Powers the LLM agents (senior Fixer). Unset -> those steps skip cleanly.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Bot 1 — audit
        id: audit
        env:
          AUDIT_SITE: https://lazytools.io
          AUDIT_COUNT: ${{ github.event.inputs.count || '10' }}
          AUDIT_OFFSET: ${{ github.event.inputs.offset }}
        run: node scripts/audit-ux.mjs

      - name: Bot 2 — fix (safe, build-gated)
        id: fix
        run: node scripts/audit-fix.mjs

      - name: Bot 2b — senior fixer (manual items, LLM; skips without key)
        id: fixllm
        run: node scripts/agent-fixer-llm.mjs

      - name: Bot 3 — manage (governance, ETAs, ratings)
        id: manage
        run: node scripts/audit-manager.mjs

      - name: Commit results
        run: |
          git config user.name  "lazytools-audit-bot"
          git config user.email "audit-bot@users.noreply.github.com"
          git add audits src
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "audit(${{ github.run_number }}): ${{ steps.audit.outputs.subject }}"
            git push
          fi

      - name: Deploy if the Fixer changed the site
        if: ${{ steps.fix.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: |
            audit-report.html
            audits/
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          echo "### ${{ steps.audit.outputs.subject }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- ${{ steps.fix.outputs.fix_summary }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- ${{ steps.manage.outputs.manager_summary }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Command deck: \`audits/dashboard.html\` · markdown: \`audits/DASHBOARD.md\` · report: \`${{ steps.audit.outputs.report }}\`" >> "$GITHUB_STEP_SUMMARY"
