# Autonomous daily audit-and-fix loop for lazytools.io. Runs token-free in CI.
#
#   Bot 1 (Auditor, scripts/audit-ux.mjs)  audits 10 rotating tools + any tool
#     awaiting verification, on the LIVE site (functionality, input/output, SEO,
#     content, accessibility via axe-core, performance, mobile, privacy). Updates
#     the git-tracked ledger (audits/ledger.json) and writes a dated report.
#   Bot 2 (Fixer, scripts/audit-fix.mjs)   applies safe, deterministic fixes to
#     open "auto" findings, gated by a full build (reverts on failure), marks
#     them "verifying", and compiles manual findings into recommendations.md.
#   Verification: the next day's Auditor re-tests "verifying" tools and marks
#     each complete, or logs a challenge with reasoning.
#
# Results are committed back to the repo (public). To also email the report, set
# repo secrets MAIL_USERNAME, MAIL_PASSWORD (Gmail App Password), AUDIT_EMAIL_TO.
name: Daily UX Audit & Fix

on:
  schedule:
    - cron: '17 6 * * *'   # every day 06:17 UTC
  workflow_dispatch:
    inputs:
      count:
        description: 'Tools to audit this run'
        default: '10'
      offset:
        description: 'Rotation start index (blank = auto by date)'
        required: false

permissions:
  contents: write        # commit the ledger / reports / source fixes
  actions: write         # dispatch deploy.yml when a fix changes the site

concurrency:
  group: audit-fix
  cancel-in-progress: false

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    env:
      MAIL_ENABLED: ${{ secrets.MAIL_USERNAME != '' && secrets.MAIL_PASSWORD != '' && secrets.AUDIT_EMAIL_TO != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Bot 1 — audit
        id: audit
        env:
          AUDIT_SITE: https://lazytools.io
          AUDIT_COUNT: ${{ github.event.inputs.count || '10' }}
          AUDIT_OFFSET: ${{ github.event.inputs.offset }}
        run: node scripts/audit-ux.mjs

      - name: Bot 2 — fix (safe, build-gated)
        id: fix
        run: node scripts/audit-fix.mjs

      - name: Commit results
        run: |
          git config user.name  "lazytools-audit-bot"
          git config user.email "audit-bot@users.noreply.github.com"
          git add audits src
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "audit(${{ github.run_number }}): ${{ steps.audit.outputs.subject }}"
            git push
          fi

      - name: Deploy if the Fixer changed the site
        if: ${{ steps.fix.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: |
            audit-report.html
            audits/reports/
          if-no-files-found: warn

      - name: Email report
        if: ${{ always() && env.MAIL_ENABLED == 'true' }}
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ${{ steps.audit.outputs.subject || 'LazyTools daily audit' }}
          to: ${{ secrets.AUDIT_EMAIL_TO }}
          from: LazyTools Auditor <${{ secrets.MAIL_USERNAME }}>
          html_body: file://audit-report.html

      - name: Email not configured
        if: ${{ always() && env.MAIL_ENABLED != 'true' }}
        run: echo "::notice title=Email skipped::Add MAIL_USERNAME, MAIL_PASSWORD (Gmail App Password) and AUDIT_EMAIL_TO secrets to receive the report. Results are committed under audits/ and uploaded as an artifact."
