# Deploys the static build to Namecheap shared hosting via explicit FTPS (port 21).
# Secrets FTP_SERVER / FTP_USERNAME / FTP_PASSWORD are configured in
# repo Settings → Secrets and variables → Actions.
#
# The FTP account is domain-scoped (CLAUDE_ACC@lazytools.io), so its root IS the
# lazytools.io docroot — hence server-dir "./".
# security: loose because shared-hosting FTPS certs are issued for the server
# hostname, not ftp.<domain> (traffic is still TLS-encrypted).
#
# NOTE: tag-triggered deploys get enabled once the pipeline has a clean dry run
# and launch week arrives (see ROADMAP.md).
name: Deploy to Namecheap

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'List changes without uploading anything'
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history so postbuild can derive per-page sitemap lastmod from git dates
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Refresh tool ratings from production (fail-safe)
        run: node scripts/fetch-ratings.mjs
      - run: npm run build
      # Shared-hosting FTPS occasionally drops the data socket mid-transfer
      # (write EPIPE), which fails an otherwise-fine deploy. The action keeps a
      # server-side sync-state file, so a retry only re-sends the unsent files.
      # Attempts 1–2 are non-fatal; attempt 3 fails the job if it still can't finish.
      - name: Deploy dist/ via FTPS (attempt 1)
        id: ftp1
        continue-on-error: true
        timeout-minutes: 30
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose
          local-dir: dist/
          server-dir: ./
          dry-run: ${{ inputs.dry-run == true }}
      - name: Deploy dist/ via FTPS (attempt 2)
        id: ftp2
        if: steps.ftp1.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 30
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose
          local-dir: dist/
          server-dir: ./
          dry-run: ${{ inputs.dry-run == true }}
      - name: Deploy dist/ via FTPS (attempt 3, final)
        if: steps.ftp1.outcome == 'failure' && steps.ftp2.outcome == 'failure'
        timeout-minutes: 30
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose
          local-dir: dist/
          server-dir: ./
          dry-run: ${{ inputs.dry-run == true }}
